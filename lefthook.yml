pre-commit:
  parallel: true
  commands:
    lint-eslint:
      run: npx eslint {staged_files} --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts
      glob: '*.{vue,js,jsx,cjs,mjs,ts,tsx,cts,mts}'

    lint-style:
      run: npx stylelint {staged_files}
      glob: '*.{css,scss,html,vue}'

    lint-format:
      run: npx prettier --write {staged_files}
      glob: '*'

    type-check:
      run: npm run type-check

post-merge:
  commands:
    install:
      run: npm install

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit $1

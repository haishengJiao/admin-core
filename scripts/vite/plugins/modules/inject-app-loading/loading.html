<div id="app-loading">
  <div class="loader"></div>
  <div class="loading-text">%VITE_APP_TITLE%</div>
</div>

<style data-app-loading="inject-css">
  #app-loading {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 19999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #f4f7f9;
  }

  .dark #app-loading {
    background-color: #0d0d10;
  }

  #app-loading.hidden {
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transition: all 0.8s ease-out;
  }

  #app-loading .loader {
    position: relative;
    box-sizing: content-box !important;
    width: 48px;
    height: 48px;
  }

  #app-loading .loader::before {
    position: absolute;
    top: 0;
    left: 50%;
    box-sizing: content-box !important;
    width: 0;
    height: 24px;
    content: '';
    border-right: 24px solid #0080ff;
    border-left: 24px solid #0080ff;
    transform: translateX(-50%);
    animation: loader-split-x 1s linear infinite alternate;
  }

  #app-loading .loader::after {
    position: absolute;
    bottom: 0;
    left: 0;
    box-sizing: content-box !important;
    width: 48px;
    height: 24px;
    content: '';
    background: #0080ff;
    animation: loader-move-y 1s linear infinite alternate;
  }

  #app-loading .loading-text {
    box-sizing: border-box !important;
    margin-top: 66px;
    font-family: auto !important;
    font-size: 28px;
    font-weight: 600;
    line-height: normal !important;
    color: rgb(0 0 0 / 85%);
  }

  .dark #app-loading .loading-text {
    color: #fff;
  }

  @keyframes loader-split-x {
    0% {
      width: 0;
      transform: translate(-50%, 0);
    }

    33% {
      width: 100%;
      transform: translate(-50%, 0);
    }

    66% {
      width: 100%;
      transform: translate(-50%, 24px);
    }

    100% {
      width: 0;
      transform: translate(-50%, 24px);
    }
  }

  @keyframes loader-move-y {
    0%,
    33% {
      transform: translateY(0);
    }

    66%,
    100% {
      transform: translateY(-24px);
    }
  }
</style>
